name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Stage 1 - Unit Tests (UT) & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run ESLint (check only)
        run: npm run lint:check

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run Jest Unit Tests
        run: npm run test:unit

      - name: Upload Unit Test HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: server/reports/unit/
          if-no-files-found: warn

      - name: Build backend application
        run: npm run build

  integration-tests:
    name: Stage 2 - Integration Tests (IT)
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos_test
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run Prisma migrations on test database
        env:
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: npx prisma migrate deploy

      - name: Run Jest Integration Tests
        env:
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
          TEST_DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: npm run test:integration

      - name: Upload Integration Test HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: server/reports/integration/
          if-no-files-found: warn

