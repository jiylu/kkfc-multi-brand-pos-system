name: CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for backend modifications
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - 'robot/**'
              - 'features/!(mobile)/**'
              - '.github/workflows/ci.yml'

  unit-tests:
    name: Stage 1 - Unit Tests (UT) & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run ESLint (check only)
        run: npm run lint:check

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run Jest Unit Tests
        run: npm run test:unit

      - name: Upload Unit Test HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: server/reports/unit/
          if-no-files-found: warn

      - name: Build backend application
        run: npm run build

  integration-tests:
    name: Stage 2 - Integration Tests (IT)
    needs: [detect-changes, unit-tests]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos_test
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run Prisma migrations on test database
        env:
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: npx prisma migrate deploy

      - name: Run Jest Integration Tests
        env:
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: npm run test:integration

      - name: Upload Integration Test HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: server/reports/integration/
          if-no-files-found: warn

  e2e-robot-tests:
    name: Stage 3 - Robot Framework E2E Tests (E2E)
    needs: [detect-changes, integration-tests]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos_test
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r robot/requirements.txt

      - name: Install Node dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client and migrate
        working-directory: server
        env:
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: |
          npm run prisma:generate
          npx prisma migrate deploy

      - name: Seed test database fixtures
        working-directory: server
        env:
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: npm run db:seed:test

      - name: Build NestJS application
        working-directory: server
        run: npm run build

      - name: Start NestJS application in background
        working-directory: server
        env:
          NODE_ENV: production
          PORT: 3000
          DATABASE_URL: postgresql://pos_test_user:pos_test_password@localhost:5432/pos_test
        run: |
          node dist/main > server.log 2>&1 &
          npx wait-on tcp:127.0.0.1:3000 --timeout 60000 || (cat server.log && exit 1)

      - name: Execute Robot Framework E2E tests
        run: robot --outputdir robot/results --xunit xunit.xml robot/tests/

      - name: Upload Robot Framework test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: robot/results/
          if-no-files-found: warn

  ci:
    name: CI
    needs: [detect-changes, unit-tests, integration-tests, e2e-robot-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify QA Automation Pipeline Completion
        run: |
          if [ "${{ needs.detect-changes.outputs.backend }}" != "true" ]; then
            echo "No backend or QA test files were modified. Backend pipeline skipped."
            echo "QA Pipeline Success: Mobile-only change satisfied branch protection."
            exit 0
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-robot-tests.result }}" != "success" ]; then
            echo "QA Pipeline Failed: One or more test stages did not succeed."
            exit 1
          fi
          echo "QA Pipeline Success: All unit, integration, and E2E test stages passed."
