name: Flutter CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Flutter CI Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies (pub get)
        run: flutter pub get

      - name: Check code formatting (dart format check)
        run: dart format --output=none --set-exit-if-changed .

      - name: Static code analysis (flutter analyze)
        run: flutter analyze

      - name: Run unit & widget tests (flutter test)
        run: flutter test --coverage

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-report
          path: mobile/coverage/
          if-no-files-found: ignore

      - name: Verify application build (build check)
        run: flutter build apk --debug
