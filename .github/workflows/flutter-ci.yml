name: Flutter CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu
    uses: ./.github/workflows/flutter-ci-platform.yml
    with:
      runner: ubuntu-24.04

  windows:
    name: Windows
    uses: ./.github/workflows/flutter-ci-platform.yml
    with:
      runner: windows-2022

  flutter-ci:
    name: Flutter CI Pipeline
    needs: [ubuntu, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require one successful platform
        env:
          UBUNTU_PASSED: ${{ needs.ubuntu.outputs.passed }}
          WINDOWS_PASSED: ${{ needs.windows.outputs.passed }}
        run: |
          echo "Ubuntu passed: ${UBUNTU_PASSED:-false}"
          echo "Windows passed: ${WINDOWS_PASSED:-false}"
          if [ "$UBUNTU_PASSED" = "true" ] || [ "$WINDOWS_PASSED" = "true" ]; then
            echo "Flutter CI passed on at least one platform."
          else
            echo "Neither platform completed all Flutter checks successfully."
            exit 1
          fi
